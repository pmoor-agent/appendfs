[package]
name = "appendfs"
version = "0.1.0"
edition = "2024"
description = "An append-only log-structured FUSE filesystem with S3 replication and instant crash recovery"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/pmoor/appendfs"
homepage = "https://github.com/pmoor/appendfs"
keywords = ["fuse", "filesystem", "append-only", "storage", "s3"]
categories = ["filesystem"]

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
blake3 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rpassword = "7.3"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
zstd = "0.13"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
md5 = "0.7"
quick-xml = { version = "0.37", features = ["serialize"] }
toml = "0.8"
url = "2.5"
base64 = "0.22"
tempfile = "3.8"
jiff = "0.2"

[lints.rust]
# `unsafe` belongs in the FFI layer (src/shim.rs), which opts back in. Anything else that
# needs it should grow a safe wrapper there instead.
unsafe_code = "deny"

[features]
default = []
testing = []

[dev-dependencies]
appendfs = { path = ".", features = ["testing"] }

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

# Key files are wrapped with full-strength Argon2id even in tests, which is several times
# slower unoptimized; optimizing just the KDF keeps debug builds and test runs quick.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
